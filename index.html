:root{--ink:#1e1b4b;--bg:#f4f1ff;--card:#fff;--muted:#6b7280;--p1:#7c3aed;--p2:#ec4899;--p3:#0ea5e9;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--gold:#ffd54a;--r:16px;--sh:0 4px 14px rgba(76,29,149,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#1f2937;font-family:'Segoe UI',Arial,'Noto Sans Hebrew',sans-serif;font-size:15px;line-height:1.45;direction:rtl}
body{min-height:100vh;background:linear-gradient(180deg,#f4f1ff 0%,#fdf2f8 55%,#ecfeff 100%) fixed}
a{color:var(--p1);text-decoration:none}
button{font:inherit;cursor:pointer}
#hdr{position:fixed;inset:0 0 auto 0;height:34px;z-index:1000;display:flex;align-items:center;gap:8px;padding:0 8px;background:linear-gradient(90deg,#1e1b4b,#4c1d95 55%,#be185d);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#hdr svg.logo{width:24px;height:24px;flex:none;border-radius:7px}
#hdr .ttl{font-weight:800;font-size:14px;white-space:nowrap}
#hdr .by{margin-inline-start:auto;font-size:12px;white-space:nowrap;opacity:.95}
#hdr .gold{font-weight:800;background:linear-gradient(180deg,#fff3b0,#ffd54a 45%,#e09b00);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;letter-spacing:.2px}
#hdr button{height:26px;min-width:26px;border:0;border-radius:8px;background:rgba(255,255,255,.18);color:#fff;font-size:14px;padding:0 6px;line-height:1}
#hdr button:active{background:rgba(255,255,255,.35)}
#hdr button.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(-360deg)}}
#app{padding:42px 10px 90px;max-width:900px;margin:0 auto}
h2{margin:6px 4px 10px;font-size:20px;color:var(--ink)}
h3{margin:0 0 4px;font-size:16px;color:var(--ink)}
.muted{color:var(--muted);font-size:13px}
/* home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ccard{position:relative;border-radius:20px;min-height:170px;color:#fff;overflow:hidden;box-shadow:var(--sh);cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));background-size:cover;background-position:center}
.ccard::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.65))}
.ccard .in{position:absolute;inset:auto 0 0 0;padding:12px;z-index:2}
.ccard .fl{position:absolute;top:8px;inset-inline-end:10px;font-size:26px;z-index:2}
.ccard h3{color:#fff;font-size:22px;margin:0}
.ccard .sub{font-size:13px;opacity:.95}
.ccard .del{position:absolute;top:6px;inset-inline-start:6px;z-index:3;width:28px;height:28px;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:15px}
.addc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:170px;border:2px dashed #a78bfa;border-radius:20px;color:var(--p1);background:rgba(255,255,255,.7);font-weight:700;gap:6px;cursor:pointer}
.addc span{font-size:36px;line-height:1}
.hello{padding:14px;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;box-shadow:var(--sh);margin-bottom:14px}
.hello h2{color:#fff;margin:0 0 2px}.search-row{margin:0 0 12px}
.search-row input{width:100%;padding:11px 14px;border:1.5px solid #ddd6fe;border-radius:14px;font:inherit;background:#fff;text-align:right;box-shadow:var(--sh)}
.search-row input:focus{outline:2px solid #7c3aed;border-color:#7c3aed}

/* hero */
.hero{border-radius:18px;color:#fff;padding:9px 12px;margin-bottom:8px;box-shadow:var(--sh);background:linear-gradient(135deg,var(--a),var(--b));position:relative;overflow:hidden}
.hero h2{color:#fff;margin:0;font-size:21px}
bdi{unicode-bidi:isolate}
.hero .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 9px;font-size:12px;white-space:nowrap}
.hero p{margin:6px 0 0;font-size:13px;opacity:.97;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.hero p.open{display:block}
/* tabs */
.tabs{position:sticky;top:34px;z-index:900;display:flex;gap:6px;overflow-x:auto;padding:6px 2px;margin:0 -10px 8px;padding-inline:10px;background:rgba(244,241,255,.93);backdrop-filter:blur(6px);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:99px;padding:6px 12px;background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1);white-space:nowrap}
.tab.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.sub{display:flex;gap:6px;overflow-x:auto;margin:0 0 8px;scrollbar-width:none}
.sub button{flex:none;border:1px solid #c4b5fd;background:#fff;color:var(--p1);border-radius:10px;padding:5px 10px;font-weight:600}
.sub button.on{background:var(--p1);color:#fff}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.card .body{padding:10px 12px 12px}
.ph{height:150px;background:linear-gradient(135deg,#c4b5fd,#f9a8d4);background-size:cover;background-position:center;background-repeat:no-repeat;position:relative;display:flex;align-items:center;justify-content:center;font-size:44px}
.ph .bd{position:absolute;inset:auto 6px 6px 6px;display:flex;flex-wrap:wrap;gap:4px}
.b{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;background:rgba(255,255,255,.92);color:var(--ink)}
.b.g{background:#d1fae5;color:#047857}.b.r{background:#fee2e2;color:#b91c1c}.b.y{background:#fef3c7;color:#b45309}.b.p{background:#ede9fe;color:#6d28d9}.b.s{background:#e0f2fe;color:#0369a1}
.loc{color:var(--muted);font-size:13px;direction:ltr;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.chip{border:0;border-radius:99px;padding:4px 11px;background:#ede9fe;color:#5b21b6;font-weight:600;font-size:13px}
.chip.on{background:var(--p1);color:#fff}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.filters .chip{flex:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.filters .chip.on{background:var(--p1)}
details{margin:6px 0}
summary{cursor:pointer;color:var(--p1);font-weight:700;padding:4px 0}
dl{margin:6px 0 0;display:grid;grid-template-columns:96px 1fr;gap:6px 8px;font-size:14px}
dt{font-weight:700;color:var(--ink)}dd{margin:0}
dd .en{direction:ltr;unicode-bidi:plaintext;display:inline-block}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:12px;padding:8px 13px;font-weight:700;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.btn.alt{background:#fff;color:var(--p1);border:1.5px solid #c4b5fd}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.stars{color:#f59e0b;letter-spacing:1px}
.price{font-weight:800;color:#047857}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:7px 8px;border-bottom:1px solid #eee;text-align:right;vertical-align:top}
th{background:#f5f3ff;color:var(--ink)}
.tiplist{list-style:none;padding:0;margin:0}
.tiplist li{display:flex;gap:10px;background:#fff;border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:var(--sh)}
.tiplist .em{font-size:26px}
.note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:8px 10px;font-size:13px;margin:8px 0}
/* map */
.map{height:60vh;min-height:340px;border-radius:16px;overflow:hidden;box-shadow:var(--sh);direction:ltr;z-index:1}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c,#7c3aed);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.pin>i{transform:rotate(45deg);font-style:normal;font-size:15px}
.num{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;border:2px solid #fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.leaflet-popup-content{direction:rtl;text-align:right;font-family:inherit;font-size:13.5px;margin:10px 12px}
.leaflet-container{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:13px;background:#fff;border-radius:99px;padding:3px 10px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.lg i{width:12px;height:12px;border-radius:50%;display:inline-block}
.lnbadge{display:inline-block;min-width:26px;text-align:center;border-radius:8px;color:#fff;font-weight:800;padding:1px 6px;font-size:13px;margin-inline-end:4px}
.poi{display:flex;gap:8px;overflow-x:auto;margin-top:6px}
.poi a{flex:none;width:96px;color:inherit;font-size:12px;text-align:center}
.poi .t{width:96px;height:70px;border-radius:10px;background:linear-gradient(135deg,#c4b5fd,#f9a8d4);background-size:cover;background-position:center}
/* forms */
label{display:block;font-weight:700;margin:8px 0 3px;color:var(--ink);font-size:14px}
input[type=text],input[type=number],select,textarea{width:100%;padding:9px 10px;border:1.5px solid #ddd6fe;border-radius:12px;font:inherit;background:#fff;text-align:right}
input.ltr{direction:ltr;text-align:left}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;margin:0;font-weight:600;background:#fff;border:1.5px solid #ddd6fe;border-radius:99px;padding:5px 11px}
.checks input:checked+span{color:var(--p1)}
.day{border-inline-start:6px solid var(--c);}
.day h3{color:var(--c)}
.tl{list-style:none;padding:0;margin:8px 0}
.tl li{position:relative;padding:0 14px 10px 0;margin-right:6px;border-right:2px dashed #d8b4fe}
.tl li::before{content:'';position:absolute;right:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--c,#7c3aed)}
.tl .tm{font-weight:800;color:var(--ink)}
.leg{color:var(--muted);font-size:13px}
/* modal & toast */
.ov{position:fixed;inset:0;z-index:2000;background:rgba(15,10,40,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:22px 22px 0 0;padding:16px;width:100%;max-width:560px;max-height:88vh;overflow:auto}
.sheet h3{font-size:18px}
.res{border:1.5px solid #ddd6fe;border-radius:12px;padding:8px 10px;margin:6px 0;cursor:pointer;background:#faf5ff}
.res:active{background:#ede9fe}
#toast{position:fixed;bottom:18px;inset-inline:12px;margin-inline:auto;max-width:420px;z-index:3000;background:#1e1b4b;color:#fff;padding:10px 14px;border-radius:14px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
#toast.show{opacity:1}
.prog{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.prog div{display:flex;gap:8px;align-items:center}
.sp{width:16px;height:16px;border:3px solid #ddd6fe;border-top-color:var(--p1);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
.wx{display:flex;gap:5px;overflow-x:auto;margin-top:5px;scrollbar-width:none}
.wx div{flex:none;background:rgba(255,255,255,.2);border-radius:10px;padding:2px 7px;text-align:center;font-size:11.5px;line-height:1.3}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.cards2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cards2 .card{margin:0}}

.tabs{scrollbar-width:thin;scrollbar-color:#a78bfa transparent}
.tabs::-webkit-scrollbar{display:block;height:6px}
.tabs::-webkit-scrollbar-track{background:transparent}
.tabs::-webkit-scrollbar-thumb{background:#a78bfa;border-radius:99px}
.tabs::-webkit-scrollbar-thumb:hover{background:#7c3aed}
@media(max-width:699px){
  .tabs{scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
}
.map-wrap{position:relative}
.map-locate{position:absolute;top:10px;left:10px;z-index:800;border:0;border-radius:12px;padding:8px 12px;font-weight:700;background:#fff;color:var(--p1);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:13px;cursor:pointer}
.map-locate:active{background:#ede9fe}
.map-toolbar{display:flex;gap:8px;margin:0 0 8px;flex-wrap:wrap}
.map-toolbar .btn{flex:1;justify-content:center}
.pick-cats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pick-list{max-height:45vh;overflow:auto;margin:6px 0}
.pick-list .res{width:100%;text-align:right}

.maplist{margin:10px 0 4px}
.maplist details.mlg{background:#fff;border-radius:14px;box-shadow:var(--sh);margin-bottom:8px;overflow:hidden}
.maplist details.mlg summary{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;font-weight:700;color:var(--ink);list-style:none}
.maplist details.mlg summary::-webkit-details-marker{display:none}
.maplist details.mlg summary::after{content:'▾';color:var(--p1);font-size:12px;margin-inline-start:8px}
.maplist details.mlg[open] summary::after{content:'▴'}
.maplist .mln{background:#ede9fe;color:#5b21b6;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:700}
.maplist ul{list-style:none;margin:0;padding:0 8px 8px}
.maplist .mlp{width:100%;text-align:right;border:0;background:#faf5ff;border-radius:10px;padding:8px 10px;margin:4px 0;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit}
.maplist .mlp:active,.maplist .mlp.on{background:#ede9fe;outline:2px solid #7c3aed}
.maplist .mlp-name{font-weight:700;color:var(--ink);font-size:14px}
.maplist .mlp-sub{font-size:12px;color:var(--muted)}

.leaflet-top.leaflet-left{margin-top:48px}
.ccard .city-img{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
@media print{#hdr,.tabs,.acts{display:none}}

.leaflet-container.nomap{background-color:#e8eefc;background-image:linear-gradient(rgba(124,58,237,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.10) 1px,transparent 1px);background-size:44px 44px}
.mapstyle{width:34px;height:34px;border:2px solid rgba(0,0,0,.2);border-radius:4px;background:#fff;font-size:17px;line-height:1;padding:0;cursor:pointer;box-shadow:none}

.selb{display:flex;gap:6px;margin:0 0 8px}
.selb button{flex:1;border:1.5px solid #ddd6fe;background:#faf5ff;color:#5b21b6;border-radius:10px;padding:6px 4px;font:inherit;font-size:13px;font-weight:700}
.selb button.on{background:#7c3aed;color:#fff;border-color:#7c3aed}
.selview{display:flex;gap:6px;margin:0 0 10px}
.selview button{flex:1;border:1.5px solid #ddd6fe;background:#fff;color:#4c1d95;border-radius:999px;padding:7px 4px;font:inherit;font-size:13px;font-weight:700}
.selview button.on{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border-color:transparent}
.gframe{width:100%;height:55vh;border:0;border-radius:14px;background:#eee}
.gframe.tall{height:68vh}
.driver{text-align:center}
.driver .dn{font-size:26px;font-weight:800;direction:ltr;margin:8px 0}
.driver .da{font-size:20px;direction:ltr;margin:4px 0 12px}
.driver .dp{font-size:18px;direction:ltr;color:#4c1d95;margin:8px 0}
.driver .dl,.driver .dh{color:#6b7280;font-size:13px}
.evl{margin:8px 0 0;padding-inline-start:18px}.evl li{margin:8px 0}

.hist{margin:6px 0}.hist summary{cursor:pointer;font-weight:700;color:#5b21b6}

const imgMem={};
async function wikiImg(title,name){
  const key=(title||'')+'|'+(name||'');
  const cache=LS.get('img',{});
  if(cache[key])return cache[key];
  if(imgMem[key]===null)return null;
  try{
    let u=null;
    const tryTitle=async (lang,t)=>{
      if(!t)return null;
      const r=await fetch('https://'+lang+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(String(t).replace(/ /g,'_')));
      if(!r.ok)return null;const j=await r.json();
      return (j.thumbnail&&j.thumbnail.source)||null;
    };
    if(title){
      let lang='en',t=title;const m=String(title).match(/^([a-z]{2,3}):(.+)$/);if(m){lang=m[1];t=m[2]}
      u=await tryTitle(lang,t);
      if(!u&&lang!=='en')u=await tryTitle('en',t);
    }
    if(!u&&name){
      // search then summary
      try{
        const sr=await fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch='+encodeURIComponent(name));
        if(sr.ok){const j=await sr.json();const hit=j.query&&j.query.search&&j.query.search[0];if(hit)u=await tryTitle('en',hit.title)}
      }catch(e){}
    }
    if(u){u=u.replace(/\/\d+px-/,'/640px-');cache[key]=u;LS.set('img',cache);return u}
    imgMem[key]=null;return null;
  }catch(e){return null}
}

  });
}

async function fillHero(c,force){
  const meta=$('#heroMeta');if(!meta)return;
  const add=h=>{const m=$('#heroMeta');if(m&&curCity()&&curCity().id===c.id)m.insertAdjacentHTML('beforeend',h)};

    const wx=$('#heroWx');
    if(wx&&curCity()&&curCity().id===c.id)wx.innerHTML=w.days.map(d=>{const dt=new Date(d.d+'T12:00');return '<div><b>'+DS[dt.getDay()]+'</b> '+pad(dt.getDate())+'/'+pad(dt.getMonth()+1)+'<br>'+(WX[d.code]||'')+' <bdi dir="ltr">'+d.max+'°/'+d.min+'°</bdi>'+(d.rain>=40?' 💧'+d.rain+'%':'')+'</div>'}).join('');

      const il=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Jerusalem',timeZoneName:'shortOffset'}).formatToParts(new Date()).find(p=>p.type==='timeZoneName').value;
      const ilOff=(il==='GMT'?0:parseFloat(il.replace('GMT','')))*3600;

      add('<span class="pill">🕐 '+(diff===0?'אותה שעה כמו בישראל':(diff===-1?'שעה אחת אחורה':diff===1?'שעה אחת קדימה':diff<0?Math.abs(diff)+' שעות אחורה':diff+' שעות קדימה')+' מישראל')+'</span>');
    }catch(e){}
  }catch(e){add('<span class="pill">🌡️ אין חיבור — מזג אוויר לא זמין</span>')}

}

function initMainMap(c){
  const m=mkMap('map',c.center,c.zoom);const g=S.layers;S.markers={};
  LAYERS.forEach(l=>g[l[0]]=L.layerGroup().addTo(m));
  const add=(layer,id,lat,lng,icon,pop)=>{
    if(lat==null||lng==null)return;
    const mk=L.marker([lat,lng],{icon}).bindPopup(pop).addTo(g[layer]);
    S.markers[layer+':'+id]=mk;
  };
  c.sites.forEach(s=>add('sites',s.id,s.lat,s.lng,pin('🏛️','#7c3aed'),popup(s.en,s.loc&&s.loc!==s.en?s.loc:'',s)));
  c.hotels.forEach(s=>add('hotels',s.id,s.lat,s.lng,pin('🏨','#d97706'),popup(s.name,'★'.repeat(s.stars)+' '+s.price,s)));
  c.restaurants.forEach(s=>add('rest',s.id,s.lat,s.lng,pin('🍽️','#dc2626'),popup(s.name,s.type+' · '+s.price,s)));
  c.shopping.forEach(s=>add('shop',s.id||s.name,s.lat,s.lng,pin('🛍️','#db2777'),popup(s.name,s.desc,s)));
  c.markets.forEach(s=>add('markets',s.id||s.name,s.lat,s.lng,pin('🧺','#059669'),popup(s.name,s.days,s)));
  Object.entries(T0(c).stations).forEach(([id,s])=>add('metro',id,s.lat,s.lng,pin('🚇','#2563eb'),popup(s.n,s.he||'',s)));
  // Leaflet needs size recalc after layout
  setTimeout(()=>{try{S.map.invalidateSize(false)}catch(e){}},50);
  setTimeout(()=>{try{S.map.invalidateSize(false)}catch(e){}},300);
}
function mapFocus(layer,id){
  if(!S.map){toast('המפה עדיין נטענת');return}
  if(!S.markers){toast('הסימונים עדיין נטענים');return}
  let mk=S.markers[layer+':'+id];
  // fallback: search by matching id string
  if(!mk){
    const key=Object.keys(S.markers).find(k=>k===layer+':'+id||k.endsWith(':'+id));

  }

  try{S.map.invalidateSize(false)}catch(e){}
  S.map.setView(mk.getLatLng(),16,{animate:true});
  setTimeout(()=>{try{mk.openPopup()}catch(e){}},200);
}

const graphCache={};
function getGraph(c){
  if(graphCache[c.id])return graphCache[c.id];
  const t=T0(c),adj={};const add=(a,b,w)=>{(adj[a]=adj[a]||[]).push([b,w])};
  t.lines.forEach(l=>{
    for(let i=0;i<l.stations.length;i++){
      const a=t.stations[l.stations[i]];if(!a)continue;
      if(i>0){const b=t.stations[l.stations[i-1]];if(b){const w=Math.max(1.5,hav(a.lat,a.lng,b.lat,b.lng)/28*60+0.7);add(l.stations[i]+'|'+l.id,l.stations[i-1]+'|'+l.id,w);add(l.stations[i-1]+'|'+l.id,l.stations[i]+'|'+l.id,w)}}
    }
  });
  const byS={};t.lines.forEach(l=>l.stations.forEach(s=>{(byS[s]=byS[s]||[]).push(l.id)}));
  Object.entries(byS).forEach(([s,ls])=>{ls.forEach(a=>ls.forEach(b=>{if(a!==b)add(s+'|'+a,s+'|'+b,8)}))});
  return graphCache[c.id]={adj,byS};
}
function dijkstra(g,srcs,dsts){
  const d={},prev={},q=new Set();srcs.forEach(s=>{d[s]=0;q.add(s)});
  const done=new Set();
  while(q.size){
    let u=null;q.forEach(x=>{if(u===null||d[x]<d[u])u=x});q.delete(u);
    if(done.has(u))continue;done.add(u);
    if(dsts.includes(u))return {path:(function(){const p=[];let x=u;while(x!==undefined){p.unshift(x);x=prev[x]}return p})(),cost:d[u]};
    (g.adj[u]||[]).forEach(([v,w])=>{if(d[v]===undefined||d[u]+w<d[v]){d[v]=d[u]+w;prev[v]=u;q.add(v)}});
  }
  return null;
}
function nearestStation(c,p){
  let best=null;Object.entries(T0(c).stations).forEach(([id,s])=>{const d=dist(p,s);if(!best||d<best.d)best={id,d,s}});return best;
}
const walkMin=km=>Math.max(1,Math.round(km*1.25/4.5*60));
function routeGuide(c,A,B){
  const t=T0(c);const dd=dist(A,B);const out=[];let total=0;
  const walkAll=walkMin(dd);
  const nsA=A.air?{id:A.air.via,s:t.stations[A.air.via],d:0}:nearestStation(c,A);
  const nsB=nearestStation(c,B);
  let ride=null;
  if(nsA&&nsB&&t.lines.length){
    const g=getGraph(c);
    const srcs=(g.byS[nsA.id]||[]).map(l=>nsA.id+'|'+l),dsts=(g.byS[nsB.id]||[]).map(l=>nsB.id+'|'+l);
    if(nsA.id===nsB.id)ride={same:true,cost:0};
    else if(srcs.length&&dsts.length)ride=dijkstra(g,srcs,dsts);
  }
  const rideTotal=ride?(A.air?0:walkMin(nsA.d))+ride.cost+3+walkMin(nsB.d):null;
  if(A.air){out.push('<li>✈️ '+esc(A.air.n)+': '+esc(A.air.how)+'</li>');}
  if(dd<1.0&&!A.air){
    out.push('<li>🚶 <b>הליכה</b> — כ-'+walkAll+' דקות ('+(dd*1.25).toFixed(1)+' ק״מ בערך). קרוב מספיק, אין צורך בתחבורה.</li>');total=walkAll;
  }else if(ride&&!ride.same&&rideTotal!=null&&(A.air||rideTotal<walkAll||dd>2.2)){
    if(!A.air)out.push('<li>🚶 הליכה אל תחנת <b class="en" style="direction:ltr;display:inline-block">'+esc(nsA.s.n)+'</b> — כ-'+walkMin(nsA.d)+' דקות</li>');
    else out.push('<li>🚇 המשך מתחנת <b class="en" style="direction:ltr;display:inline-block">'+esc(nsA.s.n)+'</b>:</li>');
    let legs=[],cur=null;

function setupTabArrows(){
  const tabs=$('#tabs'), L=$('#tabL'), R=$('#tabR');
  if(!tabs||!L||!R)return;
  const sync=()=>{
    const max=Math.max(0,tabs.scrollWidth-tabs.clientWidth);
    L.style.visibility=(tabs.scrollLeft>8||Math.abs(tabs.scrollLeft)>8)?'visible':'hidden';
    R.style.visibility=(max>8 && Math.abs(tabs.scrollLeft)<max-8)?'visible':'hidden';
  };
  // RTL: visual "right" arrow (› on the right in LTR terms of buttons) scrolls content
  L.onclick=()=>{tabs.scrollBy({left:-160,behavior:'smooth'});setTimeout(sync,280)};
  R.onclick=()=>{tabs.scrollBy({left:160,behavior:'smooth'});setTimeout(sync,280)};
  tabs.addEventListener('scroll',sync,{passive:true});
  window.addEventListener('resize',sync);
  setTimeout(sync,80);
}

  return f;

function planTrip(c,f){
  const O=originOf(c,f.hotel),start=parseDMY(f.start);
  const walkCap={low:3.5,mid:6.5,high:10.5}[f.walk]||6.5;
  const smallKids=f.kids>0&&f.kidAge<=1;
  const slow=f.senior||smallKids;
  let capH={relaxed:5.5,normal:7.5,intense:9.5}[f.pace]||7.5;if(smallKids)capH-=1;if(f.senior)capH-=0.5;
  const maxStops={relaxed:3,normal:4,intense:5}[f.pace]||4;
  const dscale=({relaxed:1,normal:.9,intense:.75}[f.pace]||.9)*(smallKids?.85:1);
  const speed=slow?3.2:4.5;
  const lowW=f.walk==='low'||f.senior;
  const ints=f.ints||[];
  const score=(s,i)=>{
    let x=3-i*0.12;
    const tg=s.tags||[];
    x+=2*tg.filter(t=>ints.includes(t)||(t==='food'&&ints.includes('food'))||(t==='shopping'&&ints.includes('shopping'))).length;
    if(f.kids>0)x+=((s.kids||2)-2)*0.8;
    if(s.museum)x+=f.mus?1:-3.5;
    if(s.hill&&lowW)x-=1.5;
    x-=dist(O,s)*0.15;
    return x;
  };
  let pool=c.sites.map((s,i)=>({s,sc:score(s,i)})).filter(x=>!x.s.trip).sort((a,b)=>b.sc-a.sc).slice(0,f.days*maxStops).map(x=>x);
  const tripSite=f.trip?c.sites.find(s=>s.trip):null;
  const plan={cityId:c.id,f,O,days:[],leftover:[]};
  const usedRest=new Set();
  const nearRest=(p,pref)=>{
    let best=null;c.restaurants.forEach(r=>{if(usedRest.has(r.id))return;let d=dist(p,r);if(pref&&isKosher(r))d-=0.6;if(!best||d<best.d)best={r,d}});
    if(best)usedRest.add(best.r.id);return best&&best.r;
  };
  for(let d=0;d<f.days;d++){
    const date=new Date(start.getTime());date.setDate(date.getDate()+d);const wd=date.getDay();
    const open=s=>!(s.closed||[]).includes(wd);
    const day={date,stops:[],notes:[],walkKm:0};
    if(tripSite&&d===f.days-1&&f.days>=2&&open(tripSite)){
      const km=dist(O,tripSite)*1.25;
      day.stops.push({s:tripSite,mode:'transit',legKm:km,legMin:Math.round(25+km*3),dur:tripSite.dur});
      day.notes.push('יום טיול מחוץ לעיר — כדאי לצאת מוקדם ולהזמין כרטיסים מראש.');
    }else{
      let cur=O,time=0,walk=0;
      while(day.stops.length<maxStops){
        let best=null;
        pool.forEach(p=>{
          const s=p.s;if(!open(s))return;
          const dkm=dist(cur,s),legKm=dkm*1.25;
          const transit=legKm>(slow?0.9:1.4)||(s.hill&&lowW&&legKm>0.5);
          const legMin=transit?Math.round(12+legKm*3):Math.round(legKm/speed*60);
          const dur=Math.max(0.5,s.dur*dscale);
          const need=legMin/60+dur,walkAdd=transit?0:legKm;
          const fits=(time+need<=capH&&walk+walkAdd<=walkCap)||day.stops.length===0;
          if(!fits)return;
          const cost=legKm-p.sc*0.5;
          if(!best||cost<best.cost)best={p,cost,legKm,legMin,transit,dur,walkAdd};
        });
        if(!best)break;
        pool=pool.filter(p=>p!==best.p);
        day.stops.push({s:best.p.s,mode:best.transit?'transit':'walk',legKm:best.legKm,legMin:best.legMin,dur:best.dur});
        time+=best.legMin/60+best.dur;walk+=best.walkAdd;cur=best.p.s;
      }
      day.walkKm=walk;
    }
    if(!day.stops.length){day.notes.push('לא נמצאו אתרים פתוחים ומתאימים ליום הזה — יום חופשי, מנוחה או שוק.')}
    // שעות
    let t=(smallKids?10:9.5)*60,lunchDone=false;
    day.stops.forEach((st,i)=>{
      t+=st.legMin;st.arrive=t;t+=st.dur*60;st.end=t;
      if(!lunchDone&&t>=12*60+20&&!day.lunch){day.lunch={at:Math.round(t),r:nearRest(st.s,ints.includes('jewish')),idx:i};t+=60;lunchDone=true}
    });
    if(!day.lunch&&day.stops.length){const m=day.stops[Math.floor(day.stops.length/2)];day.lunch={at:Math.round(m.end),r:nearRest(m.s,ints.includes('jewish')),idx:Math.floor(day.stops.length/2),late:true}}
    const last=day.stops.length?day.stops[day.stops.length-1].s:O;
    day.back=dist(last,O)*1.25;
    day.dinner=nearRest(O,ints.includes('jewish'));
    day.stops.forEach(st=>{
      if(st.s.book==='required')day.notes.push('🎟️ '+st.s.en+': חובה להזמין כרטיס מראש.');
      else if(st.s.book==='recommended')day.notes.push('🎟️ '+st.s.en+': מומלץ להזמין מראש.');
      if(st.s.hill&&lowW)day.notes.push('⛰️ '+st.s.en+': אתר בעלייה — מומלץ להגיע בחשמלית/פוניקולר/מונית ולא ברגל.');
      if(/ראשון הראשון/.test(st.s.freeDays||'')&&wd===0&&date.getDate()<=7)day.notes.push('🆓 היום ראשון הראשון בחודש — ייתכן שהכניסה חינם אך הצפיפות גדולה (לבדוק).');
    });
    if(wd===6)day.notes.push('✡️ שבת: אתרים וחנויות מסוימים סגורים, במיוחד יהודיים — תכננו בהתאם.');
    plan.days.push(day);
  }
  plan.leftover=pool.map(p=>p.s);
  if(tripSite&&!plan.days.some(x=>x.stops.some(s=>s.s===tripSite)))plan.leftover.push(tripSite);
  const totWalk=plan.days.reduce((a,d)=>a+d.walkKm,0);plan.avgWalk=totWalk/plan.days.length;
  return plan;
}
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(Math.round(m%60));
function planHtml(c,p){

async function geocode(q){
  let found=[];
  try{
    const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=8&language=he&format=json&name='+encodeURIComponent(q));
    if(r.ok){const j=await r.json();
      found=(j.results||[]).map(x=>({omId:x.id,lat:x.latitude,lon:x.longitude,name:x.name,type:FC_HE[x.feature_code]||'מקום',
        display_name:[x.name,x.admin1,x.country].filter(Boolean).join(', '),address:{country:x.country,country_code:x.country_code},namedetails:{'name:he':x.name},extratags:{}}));}
  }catch(e){}
  if(found.length)return found;
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&namedetails=1&extratags=1&limit=8&accept-language=he&q='+encodeURIComponent(q));
  if(!r.ok)throw 0;
  let arr=await r.json();const seen=new Set();
  return arr.filter(x=>{const k=x.display_name;if(seen.has(k))return false;seen.add(k);return ['place','boundary','tourism','natural','historic','leisure'].includes(x.category||x.class)}).slice(0,6).map(x=>({...x,type:TYPE_HE[x.type]||x.type||'מקום'}));
}

async function heSummary(wikiTag,fallbackName){
  try{
    let lang='en',t=wikiTag;
    if(wikiTag){const m=wikiTag.match(/^([a-z]{2,3}):(.+)$/);if(m){lang=m[1];t=m[2]}}
    if(!t&&fallbackName){
      const r=await fetch('https://he.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch='+encodeURIComponent(fallbackName));
      const j=await r.json();const hit=j.query&&j.query.search&&j.query.search[0];if(!hit)return null;lang='he';t=hit.title;
    }
    if(!t)return null;
    if(lang!=='he'){
      try{const r=await fetch('https://'+lang+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=langlinks&lllang=he&redirects=1&titles='+encodeURIComponent(t));
      const j=await r.json();const p=Object.values(j.query.pages)[0];if(p&&p.langlinks&&p.langlinks[0]){lang='he';t=p.langlinks[0]['*']}}catch(e){}
    }
    const r=await fetch('https://'+lang+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t.replace(/ /g,'_')));
    if(!r.ok)return null;const j=await r.json();
    return j.extract?{text:j.extract,lang}:null;
  }catch(e){return null}
}
